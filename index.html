<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="color-scheme" content="dark" />

    <!-- Primary SEO -->
    <title>Job Application Tracker — Organize Applications, Interviews &amp; Offers</title>
    <meta
      name="description"
      content="Track every job application in one place. Log companies, roles, and status, then filter and update interviews, offers, and rejections as you go. Free, fast, and accessible."
    />
    <meta name="keywords" content="job tracker, job application tracker, interview tracker, job search organizer, career tracker" />
    <meta name="robots" content="index, follow" />
    <!-- Canonical -->

    <!-- Icons & PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph (social sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Job Application Tracker" />
    <meta property="og:title" content="Job Application Tracker — Stay Organized" />
    <meta
      property="og:description"
      content="Log applications, update interview status, and keep every job search in one fast dashboard. Works on all devices."
    />
    <meta property="og:url" content="/" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Job Application Tracker" />
    <meta
      name="twitter:description"
      content="A fast, accessible dashboard for tracking job applications across every device."
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Job Application Tracker",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "description": "Log job applications, update interview status, and keep your job search organized in one place.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
